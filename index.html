<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hệ Thống Tra Cứu & Từ Điển</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #1e293b;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --radius: 12px;
      --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.6;
      padding: 24px 16px;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 32px;
    }

    header h1 {
      font-size: 1.875rem;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 8px;
    }

    header p {
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    .search-box {
      background: var(--card-bg);
      padding: 8px;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      display: flex;
      gap: 8px;
      border: 1px solid var(--border);
      margin-bottom: 24px;
    }

    .search-box input {
      flex: 1;
      border: none;
      outline: none;
      padding: 12px 16px;
      font-size: 1rem;
      border-radius: calc(var(--radius) - 4px);
    }

    .search-box button {
      background: var(--primary);
      color: white;
      border: none;
      padding: 12px 24px;
      font-weight: 600;
      font-size: 0.95rem;
      border-radius: calc(var(--radius) - 4px);
      cursor: pointer;
      transition: background 0.2s;
    }

    .search-box button:hover {
      background: var(--primary-hover);
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.8rem;
      padding: 4px 10px;
      background: #ecfdf5;
      color: #059669;
      border-radius: 9999px;
      margin-bottom: 16px;
      font-weight: 500;
    }

    .results-container {
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      padding: 24px;
      min-height: 200px;
    }

    .result-item {
      padding: 16px 0;
      border-bottom: 1px solid var(--border);
    }

    .result-item:last-child {
      border-bottom: none;
    }

    .result-title {
      font-size: 1.2rem;
      font-weight: 600;
      color: var(--primary);
      margin-bottom: 4px;
    }

    .result-desc {
      color: var(--text);
      font-size: 1rem;
    }

    .empty-state {
      text-align: center;
      color: var(--text-muted);
      padding: 40px 0;
    }

    .footer {
      text-align: center;
      margin-top: 40px;
      font-size: 0.85rem;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Từ Điển & Tra Cứu Dữ Liệu</h1>
      <p>Hệ thống tra cứu nhanh, chuẩn xác và đồng bộ dữ liệu</p>
    </header>

    <div style="text-align: center;">
      <div class="status-badge" id="apiStatus">
        ● Đã kích hoạt mã xác thực kết nối
      </div>
    </div>

    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Nhập từ khóa cần tra cứu..." autofocus />
      <button onclick="handleSearch()">Tra Cứu</button>
    </div>

    <main class="results-container" id="resultsArea">
      <div class="empty-state">
        Nhập từ khóa và nhấn <strong>Tra Cứu</strong> để xem kết quả.
      </div>
    </main>

    <footer class="footer">
      <p>© 2026 Hệ thống xây dựng bởi Thầy Năm | Tối ưu cho Web & GitHub Pages</p>
    </footer>
  </div>

  <script>
    // CẤU HÌNH HỆ THỐNG VÀ TOKEN XÁC THỰC CỦA THẦY
    const APP_CONFIG = {
      AUTH_TOKEN: "AQ.Ab8RN6K8IVNKn41N6_AlT2bJaH1R2wNNVzrb92yWiqm9LaK2gQ",
      API_ENDPOINT: "" // Điền URL Google Apps Script Web App hoặc Supabase API URL tại đây nếu có
    };

    // Dữ liệu mẫu khởi tạo ngoại tuyến (Fallback Data)
    const localDatabase = [
      { key: "tiếng mông", mean: "Lus Hmoob - Ngôn ngữ của đồng bào dân tộc Mông." },
      { key: "chào bạn", mean: "Nyob zoo - Lời chào hỏi thông dụng." },
      { key: "cảm ơn", mean: "Ua tsaug - Lời cảm ơn chân thành." },
      { key: "thầy giáo", mean: "Xib hwb - Người thầy truyền dạy tri thức." }
    ];

    // Xử lý sự kiện nhấn Enter trong ô tìm kiếm
    document.getElementById("searchInput").addEventListener("keypress", function (e) {
      if (e.key === "Enter") {
        handleSearch();
      }
    });

    // Hàm thực hiện tìm kiếm & truy vấn dữ liệu
    async function handleSearch() {
      const query = document.getElementById("searchInput").value.trim().toLowerCase();
      const resultsArea = document.getElementById("resultsArea");

      if (!query) {
        resultsArea.innerHTML = `
          <div class="empty-state">
            Vui lòng nhập từ khóa để tiến hành tra cứu.
          </div>`;
        return;
      }

      resultsArea.innerHTML = `<div class="empty-state">Đang tìm kiếm...</div>`;

      try {
        // Nếu có API Endpoint trực tuyến, gọi qua fetch kèm Token xác thực
        if (APP_CONFIG.API_ENDPOINT) {
          const response = await fetch(`${APP_CONFIG.API_ENDPOINT}?q=${encodeURIComponent(query)}&token=${APP_CONFIG.AUTH_TOKEN}`);
          const data = await response.json();
          renderResults(data);
        } else {
          // Tra cứu trên bộ dữ liệu local nếu chưa gắn URL Web App
          const matched = localDatabase.filter(item => 
            item.key.toLowerCase().includes(query) || 
            item.mean.toLowerCase().includes(query)
          );
          renderResults(matched);
        }
      } catch (error) {
        console.error("Lỗi truy vấn:", error);
        resultsArea.innerHTML = `
          <div class="empty-state" style="color: #dc2626;">
            Có lỗi khi kết nối dữ liệu. Đang chuyển sang tra cứu dự phòng.
          </div>`;
      }
    }

    // Hàm hiển thị kết quả ra giao diện
    function renderResults(list) {
      const resultsArea = document.getElementById("resultsArea");

      if (!list || list.length === 0) {
        resultsArea.innerHTML = `
          <div class="empty-state">
            Không tìm thấy kết quả phù hợp với từ khóa đã nhập.
          </div>`;
        return;
      }

      let html = "";
      list.forEach(item => {
        html += `
          <article class="result-item">
            <h2 class="result-title">${item.key || item.tuKhoa || "Từ tra cứu"}</h2>
            <p class="result-desc">${item.mean || item.nghia || "Không có nội dung giải nghĩa"}</p>
          </article>
        `;
      });

      resultsArea.innerHTML = html;
    }
  </script>
</body>
</html>
